services:
  video-pipeline:
    build: .
    image: kevin10x/live-video-cycle-tracking:latest
    container_name: video-pipeline
    ports:
      - "4100:4100"
    environment:
      PORT: 4100
      CORS_ORIGIN: "*"
      # Platform credentials (real adapters). Leave unset to run simulated.
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      YOUTUBE_CHANNEL_ID: "${YOUTUBE_CHANNEL_ID:-}"
      TIKTOK_ACCESS_TOKEN: "${TIKTOK_ACCESS_TOKEN:-}"
      TIKTOK_OPEN_ID: "${TIKTOK_OPEN_ID:-}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
