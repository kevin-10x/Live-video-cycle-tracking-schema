name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video-pipeline/package-lock.json

      - name: Install dependencies
        working-directory: video-pipeline
        run: npm ci

      - name: Run tests
        working-directory: video-pipeline
        run: npm test

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: video-pipeline
          file: video-pipeline/Dockerfile
          push: false
          tags: video-pipeline:test
